[project]
name = "script-writer-lab"
version = "0.1.0"
description = "Playground: quality contract + self-optimization loop for Script_Writer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "jsonschema>=4",
    "rapidfuzz>=3",
    "llm-verifier>=0.2",   # LLM-as-a-Verifier 官方实现(ADR-0001 L-D4;需要返回 logprobs 的 OpenAI 兼容端点)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: 需要真实 API 的测试(默认跳过,--run-llm 开启)",
]

[tool.ruff]
src = ["src"]
line-length = 110
