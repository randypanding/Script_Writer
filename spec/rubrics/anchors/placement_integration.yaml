dimension: placement_integration
anchors:
  - score: 1
    label: 贴上去的硬广
    sample: |
      林姐：（举起奶茶）这款0蔗糖轻乳茶用的是进口茶基，
            热量只有普通奶茶的三分之一，我每天都喝。
    why: "角色变成了播音员。植入可以整段删除而剧情毫无变化——这是判定 1 分的硬标准。"
  - score: 5
    label: 产品是冲突的解法
    sample: |
      客户：（推开杯子）我血糖高，不喝奶茶。
      林姐：（换了一杯推过去）这杯不加蔗糖。
      客户：都这么说。
      林姐：那你喝一口，不好喝我今天这单不要了。
      （客户喝了一口，停住，又喝了一口）
      客户：……你这单，我签。
    why: "卖点（0蔗糖）由'反对者被说服'的后果体现，没有一个形容词。删掉产品这场戏就不存在了 → plot_connection=high。"
  - score: 3
    label: 顺滑展示但未戏剧化融入
    sample: |
      林姐：（递过奶茶）尝尝，我们新出的。
      客户：（喝）嗯，好喝。
    why: "植入不生硬，但产品没有成为解决冲突的必要条件——删掉产品剧情依然完整。戏剧张力不足，卖点由'展示'承载而非由'后果'体现。"