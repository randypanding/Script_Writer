# 锚定样例：用成对样本定义"品味"（D2 形态3）。每个维度至少 score2 与 score5 各一对。
dimension: producibility
anchors:
  - score: 2
    label: 户外大场面 + 群演
    context: "奶茶品牌短剧，1 天拍摄预算"
    sample: |
      （雨天，城市广场，数百名群演在雨中排队）
      主角穿过人潮，跳上广场中央的舞台，
      身后是租来的巨型 LED 屏幕和烟雾机。
    why: "需要户外大场面、数百群演、舞台与 LED、雨天调度——商家自有团队 1-2 天根本拍不出来，成本爆炸。"
  - score: 5
    label: 一桌两椅可复用场景
    context: 同上
    sample: |
      （店内，一张桌子，主角与客户对坐）
      主角：（把奶茶推过去）您先尝一口。
      客户：（喝了一口，停顿）……再来一杯。
    why: "全部发生在同一个可复用的店内场景，两名演员，零群演零特效零道具改造。1 天、2-4 人、1 个场地即可完成。"
  - score: 3
    label: 需少量置景但整体可控
    context: 同上
    sample: |
      （主角家客厅）
      主角拿起手机，对着镜头展示外卖订单页面。
      （需要一台能显示界面的手机支架 + 补光灯）
    why: "场景可控，但需要手机支架、补光灯等小道具与跟焦，比纯对坐多了些置景成本，仍在可拍范围，只是不极致。"
