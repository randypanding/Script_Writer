# 锚定样例：用成对样本定义"追读性"（D2 形态3）。每个维度至少 score2 与 score5 各一对。
dimension: reading_attraction
anchors:
  - score: 1
    label: 章末平铺收束，读完无钩
    context: "营销短剧第一集，品牌 brief：demo_tea"
    sample: |
      林姐把合同签完，抬头看见窗外的天已经黑了。
      她揉了揉肩膀，拿起手机，给助理发了一条消息：明天下午的会改到三点。
      手机屏幕的光照在她脸上，她微微笑了一下。
    why: "章末没有任何悬念指向，也没有未满足的信息缺口。情绪一路平直，没有张弛节拍——读者看完这段不会想知道接下来发生什么。"
  - score: 3
    label: 有钩但空泛，悬念指向模糊
    context: "营销短剧第一集，品牌 brief：demo_tea"
    sample: |
      林姐：（放下杯子）有些事，我还没想清楚。
      客户：什么事？
      林姐：到时候你就知道了。
      （镜头切到林姐一个人站在门口，看着远处的招牌出神）
    why: "有未解答的问题，但'有些事'指向过于模糊，读者无法形成具体期待。情绪有轻微起伏（欲言又止），但没有可转述的具体画面或台词——记忆点弱。"
  - score: 5
    label: 章末钩具体可感，悬念指向明确对象
    context: "营销短剧第一集，品牌 brief：demo_tea"
    sample: |
      客户：（把合同推到一边）我不是来喝奶茶的。
      林姐：那你是来……
      客户：（递过一张照片）我女儿上周在这里喝的，今天过敏进了医院。
      （林姐的表情僵住。镜头切到柜台上一杯未动的水果茶，吸管插在里面，水珠沿着杯壁滑下来。）
    why: "悬念指向具体对象（一杯水果茶 + 女儿过敏事件），读者必须翻页才知道林姐如何回应。情绪落差明显（日常交易→危机），画面（水珠滑落）可被转述为记忆点——读完想翻下一页。"
