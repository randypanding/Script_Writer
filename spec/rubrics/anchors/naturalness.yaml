# 锚定样例：用成对样本定义"品味"（D2 形态3）。每个维度至少 score2 与 score5 各一对。
dimension: naturalness
anchors:
  - score: 2
    label: 解释性台词
    context: "女儿劝母亲别熬夜做代购"
    sample: |
      女儿：妈，你已经连续三个晚上熬到两点了，你这样下去身体会垮掉的，
            而且你做代购本来就是为了给我攒学费，我不想让你这么辛苦。
    why: "一句话交代了时长、后果、动机、关系四层信息。真人不会这样说话——这是给观众听的，不是给妈妈听的。"
  - score: 5
    label: 潜台词与信息不对称
    context: 同上
    sample: |
      女儿：（把台灯按掉）
      母亲：还有两单。
      女儿：我不上大学了。
      母亲：……你说什么？
    why: "没有一句解释。动作代替形容词，威胁代替说服，母亲的反问把冲突推上去。观众自己拼出了全部背景。"
  - score: 3
    label: 半自然但仍在说明
    context: 同上
    sample: |
      女儿：妈，两点了。
      母亲：最后一单，做完就睡。
      女儿：你昨天也是这么说的，前天也是。
    why: "对白节奏对了，但第三句仍在替观众总结。改成'你昨天也这么说'即可到 4 分。"
  # ---- 压抑/释放配比锚点（起点口径，ADR-0011 / T-30）----
  - score: 2
    label: 压抑堆叠失衡（起点口径反例）
    context: "连载多章的情绪配比审查"
    sample: |
      连续四章都是被打压、被误解、被辜负，读者憋到第五章
      还看不到任何一次释放或反击。
    why: "判定：压抑与释放的比例偏离约 3:7（起点口径）即命中；连续压抑超过 3 章未安排释放点，读者会弃书，直接按低分处理。"
  - score: 5
    label: 压抑释放配比达标（起点口径正例）
    context: 同上
    sample: |
      三分篇幅铺压抑（被抢功、被误会），七分篇幅给释放
      （当众反转、打脸兑现），且连续压抑从不超过 3 章。
    why: "判定：压抑与释放比例约 3:7、连续压抑不超过 3 章（起点口径）——两条同时满足，情绪体验才算自然可追。"