# 锚定样例：用成对样本定义"品味"（D2 形态3）。每个维度至少 score2 与 score5 各一对。
dimension: prose_craft
anchors:
  - score: 2
    label: 抽象情绪标签 + 空话套话（机器味）
    context: "奶茶店对质场景的小说叙述段"
    sample: |
      林晚非常害怕，心里无比难过，似乎整个世界都背叛了她。
      她缓缓地走进店里，深深地吸了一口气，展现出了惊人的勇气。
    why: "给情绪直接命名（非常害怕/无比难过）、空话套话（缓缓地/深深地/展现出了）、弱化词（似乎）全部命中反AI指纹。读者读到的不是画面而是'情绪说明书'。"
  - score: 3
    label: 有具体动作但情绪仍靠命名
    context: 同上
    sample: |
      林晚在门口站了一会儿，攥着包带的手有些发抖。她很紧张，
      但还是推开门走了进去，脚步很轻。
    why: "有可感知的细节（攥包带、手发抖），但'她很紧张'仍是直接命名；文笔可读但没完全脱离'告诉'模式。"
  - score: 5
    label: 感官锚点 + 动作承接，不点破情绪
    context: 同上
    sample: |
      门把手凉得像块冰。林晚把包带在手上绕了两圈，没有敲门，
      拧开一条缝挤进去。吧台后面的蒸汽扑了她一脸，
      她站在原地，直到眼睛适应了那层白雾，才看清对面站着谁。
    why: "情绪（紧张/抗拒）完全由身体动作与感官呈现（包带绕两圈、不敲门、挤进去、被蒸汽扑脸），不出现任何一个情绪名词。读者自己感到紧张。"
  # ---- 以下 12 条为结构性反模式锚点（autonovel ANTI-PATTERNS.md，ADR-0011 / T-30）----
  - score: 1
    label: 反模式 OVER-EXPLAIN（情绪拍后又解释）
    context: "任意情绪节拍后的叙述段"
    sample: |
      她攥紧了拳头，指节发白。她很愤怒，也很委屈，
      这种复杂的情绪让她不知所措。
    why: "判定：情绪已由动作/对白拍出后，1 句内又出现'她很/他感到'式命名解释，即命中——等于把读者刚获得的领悟没收，直接判低分。"
  - score: 1
    label: 反模式 TRIADIC LISTING（三段式列举堆叠）
    context: "单章叙述"
    sample: |
      她想起了清晨的地铁、中午的外卖、深夜的台灯。
      他改了提案的标题、字体、页脚。
    why: "判定：'A、B、C'式三项列举单章超过 2 处即命中——这是模板化排比指纹，出现第三处时直接扣分。"
  - score: 1
    label: 反模式 NEGATIVE-ASSERTION（否定断言堆叠）
    context: "单章叙述"
    sample: |
      她不是不难过，也不是不在乎，更不是没有想过离开。
    why: "判定：'不是不X/并非因为X'式否定断言单章超过 1 处即命中——一次是修辞，两次起就是机器味。"
  - score: 1
    label: 反模式 CATALOGING-BY-THINKING（思考式编目）
    context: "人物内心戏段落"
    sample: |
      她开始盘算：第一，房租还有三个月；第二，存款只剩两万；
      第三，下一份工作还没有着落。
    why: "判定：用'第一/第二/第三'或冒号清单把人物思考写成目录即命中——真人内心不会自带编号。"
  - score: 1
    label: 反模式 SIMILE CRUTCH（"the way"式明喻拐杖）
    context: "单章叙述"
    sample: |
      她笑起来的样子，就像那年夏天那样。
      他关门的动作，就像电影里那样。
    why: "判定：'像…那样/就像…一样'的悬挂式明喻单章超过 2 处即命中——比喻密度暴露生成痕迹。"
  - score: 1
    label: 反模式 SECTION-BREAK CRUTCH（分节符拐杖）
    context: "单章排版"
    sample: |
      ……她走出了门。

      * * *

      第二天，她回来了。
    why: "判定：单章使用超过 2 个分节符（* * * / --- / 空行+符号）来跳切时间即命中——用排版代替转场是结构偷懒。"
  - score: 2
    label: 反模式 PARAGRAPH LENGTH UNIFORMITY（段落长度均匀）
    context: "单章或成段叙述"
    sample: |
      每一段都是三到四句，每句都是十五到二十字，节奏平得像尺子量过。
      第二段也是三句，长度也差不多。第三段还是。
    why: "判定：连续多段句数与字数高度接近（目测无长短交错）即命中——人写的段落天然有长有短。"
  - score: 2
    label: 反模式 PREDICTABLE EMOTIONAL ARCS（情绪弧可预测）
    context: "跨章情绪走向"
    sample: |
      每章都是开头压抑、中段小胜、结尾再压一点的同一条弧线，
      读第三章就能预测第五章的情绪位置。
    why: "判定：连续 3 章以上情绪曲线形状同构（压-松-压的固定节拍）即命中——可预测的弧线等于没有弧线。"
  - score: 2
    label: 反模式 REPETITIVE CHAPTER ENDINGS（章末收尾重复）
    context: "连续章节的最后一段"
    sample: |
      第二章结尾：她望着窗外，久久没有说话。
      第三章结尾：他看着屏幕，久久没有说话。
    why: "判定：连续章节以同一种静物+沉默句式收尾即命中——章末是钩子位，重复收尾等于放弃钩子。"
  - score: 2
    label: 反模式 BALANCED ANTITHESIS IN DIALOGUE（"不是X而是Y"对白）
    context: "人物对白"
    sample: |
      林晚：我要的不是道歉，而是态度。
      阿哲：你看到的不是妥协，而是底线。
    why: "判定：'不是X，而是Y'式对仗句出现在对白中即命中——真人说话不押题，这是书面修辞泄漏进台词。"
  - score: 2
    label: 反模式 DIALOGUE AS WRITTEN PROSE（对白书面化无打断）
    context: "两人对话场景"
    sample: |
      林晚：我认为我们应该先确认数据来源，再讨论投放策略，
            否则所有的结论都建立在不可靠的基础上。
    why: "判定：对白连续成段、无气口无打断、一句塞满逻辑链即命中——台词是给耳朵的，不是给眼睛的。"
  - score: 2
    label: 反模式 SCENE-SUMMARY IMBALANCE（场景占比不足）
    context: "单章内容构成"
    sample: |
      三千字里两千字在概述'这段时间发生了什么'，
      真正落地的现场对话只有两小段。
    why: "判定：单章现场化场景（有对话有动作的实时画面）占比低于 70% 即命中——概述挤掉场景，沉浸感归零。"
