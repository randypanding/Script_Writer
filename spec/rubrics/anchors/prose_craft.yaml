# 锚定样例：用成对样本定义"品味"（D2 形态3）。每个维度至少 score2 与 score5 各一对。
dimension: prose_craft
anchors:
  - score: 2
    label: 抽象情绪标签 + 空话套话（机器味）
    context: "奶茶店对质场景的小说叙述段"
    sample: |
      林晚非常害怕，心里无比难过，似乎整个世界都背叛了她。
      她缓缓地走进店里，深深地吸了一口气，展现出了惊人的勇气。
    why: "给情绪直接命名（非常害怕/无比难过）、空话套话（缓缓地/深深地/展现出了）、弱化词（似乎）全部命中反AI指纹。读者读到的不是画面而是'情绪说明书'。"
  - score: 3
    label: 有具体动作但情绪仍靠命名
    context: 同上
    sample: |
      林晚在门口站了一会儿，攥着包带的手有些发抖。她很紧张，
      但还是推开门走了进去，脚步很轻。
    why: "有可感知的细节（攥包带、手发抖），但'她很紧张'仍是直接命名；文笔可读但没完全脱离'告诉'模式。"
  - score: 5
    label: 感官锚点 + 动作承接，不点破情绪
    context: 同上
    sample: |
      门把手凉得像块冰。林晚把包带在手上绕了两圈，没有敲门，
      拧开一条缝挤进去。吧台后面的蒸汽扑了她一脸，
      她站在原地，直到眼睛适应了那层白雾，才看清对面站着谁。
    why: "情绪（紧张/抗拒）完全由身体动作与感官呈现（包带绕两圈、不敲门、挤进去、被蒸汽扑脸），不出现任何一个情绪名词。读者自己感到紧张。"
