# 锚定样例：用成对样本定义"品味"（D2 形态3）。每个维度至少 score2 与 score5 各一对。
dimension: hook_strength
anchors:
  - score: 2
    label: 环境铺垫开场
    context: "美妆短剧第一集开场"
    sample: |
      （清晨，城市，阳光洒进公寓）
      旁白：林晚是在这座城市打拼的第五年，和很多人一样，
            她在日复一日的通勤里慢慢习惯了孤独。
      （镜头慢慢推向窗台，桌上的口红……）
    why: "前 3 秒没有任何冲突，是'设定解说 + 氛围'。观众没有停下来看的理由——开场 Beat 没有可被转述的记忆点。"
  - score: 5
    label: 立刻的具体冲突 + 可复述的一句话
    context: 同上
    sample: |
      直播间弹幕刷屏：「主播你脸上的痘印呢？这滤镜也太假了吧。」
      林晚：（对着镜头）今天是素颜直播。
      （她把美颜插件当着所有人点掉，屏幕里出现一张带着痘印但干净的脸）
      弹幕瞬间炸了。
    why: "开场第 3 秒就有一个'反常识状态'（素颜直播 + 主动关美颜），立刻形成未解答的问题（她为什么敢？）和一个能被转述的记忆点。"
  - score: 3
    label: 有冲突但无记忆点
    context: 同上
    sample: |
      林晚：（对同事）我跟你说，这次直播的数据再不行，
            我就得走人了。
      同事：那怎么办？
      林晚：不知道。
    why: "冲突存在（数据差、可能被辞退）但太抽象，没有具体细节，也没有一句能被观众复述的钩子。"
