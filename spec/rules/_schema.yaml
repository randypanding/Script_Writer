$schema: "https://json-schema.org/draft/2020-12/schema"
title: NSC Knowledge Rule (A5)
type: object
additionalProperties: false
required: [id, level, statement, scope, form, evidence_ids, created_at]
properties:
  id: {type: string, pattern: "^R[0-3]-[0-9]{4}$"}
  level: {enum: [L0, L1, L2, L3, deprecated]}
  statement: {type: string, minLength: 10, description: "一句可判定的规则陈述"}
  rationale: {type: string}
  scope:
    type: object
    required: [kind]
    properties:
      kind: {enum: [global, format, industry, client]}
      value: {type: string}
  form: {enum: [schema, check, rubric, prompt, profile_default, non-normative]}
  target: {type: string, description: "落地文件路径，如 spec/checks/brand/BM-013.yaml"}
  evidence_ids: {type: array, items: {type: string, pattern: "^(case|obs):[0-9A-Za-z]+$"}, minItems: 1}
  dimension: {enum: [structural, character, placement, dialogue, factual, compliance, producibility, taste]}
  hit_count: {type: integer, default: 0}
  fired_case_ids: {type: array, items: {type: string}}
  effect_size: {type: ["number","null"]}
  validation_report: {type: string}
  created_at: {type: string, format: date-time}
  last_fired_at: {type: ["string","null"], format: date-time}
  superseded_by: {type: ["string","null"]}
allOf:
  - if: {properties: {level: {const: L3}}}
    then: {required: [target, validation_report, dimension], properties: {evidence_ids: {minItems: 3}}}
  - if: {properties: {dimension: {const: taste}}}
    then: {properties: {scope: {properties: {kind: {const: client}}}}}