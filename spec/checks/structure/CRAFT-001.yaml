id: CRAFT-001
title: 主角与对手每集同场（低冲突题材豁免对手项）
domain: structure
severity: warn
stage: after_p4
select: episodes[*]
bind:
  pro: '@.__ctx.ir.characters[?role==''protagonist''].id'
  ant: '@.__ctx.ir.characters[?role==''antagonist''].id'
  ant_req: "@.__ctx.profile.craft_shape.antagonist_required || `true`"
assert: any_of(pro, 'x in item.__present_character_ids') and (not ant_req or any_of(ant,
  'x in item.__present_character_ids'))
message: 第 {item.no} 集主角与对手（antagonist）未同场。爆款短剧 83% 的冲突是人与人（315
  卡实证）：没有对手在场的集只能写内心戏，张力必然平。请让本集至少一场戏让主角与对手同框；若
  Bible 没有 antagonist，请先补一个与主角立场冲突的角色。（若 profile.craft_shape 表明本作为
  低冲突题材（antagonist_required=false，如治愈成长），本条对手项属题材豁免，主角在场仍需保证。）
tags:
- craft
- conflict
