# 受管制的功效/疗效表述正则（CMP-002 用）。
#
# 由 _load_domain_extras() 自动并入 ctx.compliance.regulated_claim_patterns。
# 每条约 50 字以内，避免跨行歧义；regex_any 对每条独立 search。
# 白名单（brand.legal.claim_whitelist）可放过指定表述。

regulated_claim_patterns:
  # 基础医疗宣称
  - "治疗|治愈|根治|抗癌|防癌"
  # 慢性病/代谢/体重（茶饮/保健品常见绕行）
  - "降血糖|降糖|控糖|稳糖|阻糖|降血压|降压|稳血压|减肥|减脂|燃脂|燃烧脂肪|瘦身|纤体|排毒|清肠|润肠|通便|改善便秘|抗糖|提高代谢|提升代谢|促进新陈代谢|降低胆固醇|调节内分泌|抗疲劳"
  # 免疫/衰老
  - "提高免疫|增强免疫|提升免疫|增加抵抗力|抗衰老|抗氧化|抗老|抗衰"
  # 皮肤疗效（护肤品/医美常见违规）
  - "祛斑|淡斑|美白|焕白|提亮肤色|收缩毛孔|细致毛孔|收毛孔|淡化细纹|淡化皱纹|减少皱纹|修复屏障|修复痘印|修复敏感肌|阻断黑色素|抑制黑色素|促进胶原蛋白|增加胶原蛋白|医美级|械字号|医用级|消炎|镇静|抗炎"
  # 生理功能改善
  - "改善睡眠|调理肠胃|改善肠道|调节肠道|预防血栓|抗过敏|修复DNA|逆转衰老|止血|化瘀|软化血管"
  # TCM/中医功效
  - "清热解毒|滋阴补肾|补气血|暖宫|祛湿|降火|消肿止痛|止痒"
