# prose 域词表资产（ADR-0011）。来源：inkos post-write-validator.ts / ai-tells.ts、
# autonovel evaluate.py 的生产实测词表。由 build_view 按域加载为 ctx.prose.*。
# 正则键一律用双引号书写：YAML 双引号内 \\ 才还原为单反斜杠（合法正则转义）。
fatigue_words: [冷笑, 不可思议, 震惊, 难以置信, 深吸一口气, 眼中闪过一丝, 仿佛, 不禁, 宛如, 竟然, 核心动机, 信息边界]
hedge_words: [似乎, 可能, 或许, 大概, 某种程度上, 一定程度上, 在某种意义上]
transition_words: [然而, 不过, 与此同时, 另一方面, 尽管如此, 话虽如此, 但值得注意的是]
surprise_markers: [仿佛, 忽然, 竟然, 猛地, 猛然, 不禁, 宛如]
report_terms: [核心动机, 信息边界, 信息落差, 核心风险, 利益最大化, 当前处境, 行为约束, 性格过滤, 情绪外化, 锚定效应, 沉没成本, 认知共鸣]
sermon_words: [显然, 毋庸置疑, 不言而喻, 众所周知, 不难看出]
banned_sentence_patterns:
  - "不是[^，。！？\\n]{0,30}[，,]?\\s*而是"
meta_narration_patterns:
  - "到这里[，,]?算是"
  - "接下来[，,]?(?:就是|将会|即将)"
  - "(?:后面|之后)[，,]?(?:会|将|还会)"
  - "(?:故事|剧情)(?:发展)?到了"
  - "读者[，,]?(?:可能|应该|也许)"
  - "我们[，,]?(?:可以|不妨|来看)"
collective_shock_patterns:
  - "(?:全场|众人|所有人|在场的人)[，,]?(?:都|全|齐齐|纷纷)?(?:震惊|惊呆|倒吸凉气|目瞪口呆|哗然|惊呼)"
  - "(?:全场|一片)[，,]?(?:寂静|哗然|沸腾|震动)"
chapter_ref_patterns:
  - "第\\s*\\d+\\s*章"
  - "[Cc]hapter\\s+\\d+"
