# 锚定样例：用成对样本定义"品味"（D2 形态3）。每个维度至少 score2 与 score5 各一对。
dimension: transportation
anchors:
  - score: 2
    label: 先讲产品后补情绪
    context: "养生茶品牌短剧，第一集"
    sample: |
      旁白：很多上班族都有熬夜、脱发的困扰。XX 养生茶，
            精选人参、枸杞、红枣，古法熬制，熬夜后来一杯，
            帮你找回状态。
      （镜头切到主角加班，桌上摆着一杯茶）
    why: "开场直接报产品卖点，情绪（焦虑）只是贴上去的背景板。品牌与情绪之间没有因果——观众知道这是广告，进不了故事。"
  - score: 5
    label: 情绪先到品牌后到，代价可感知
    context: 同上
    sample: |
      凌晨两点，主角把电脑合上，对着镜子看见自己发际线又后退了一截。
      她盯着那缕头发看了三秒，打开手机，下单了一款宣称养发的茶。
      第二天快递到，她拆开，看到配料表第一行写着"人参"，
      却先哭了——因为她想起，母亲生前最常喝的就是人参茶。
    why: "痛点（脱发/加班）具体、代价可感知，主角在做选择而非被动。品牌不是被宣称的，而是作为情绪（思念母亲）的载体自然出现——情绪与品牌有因果，观众被带进去了。"
  - score: 3
    label: 有痛点但主角被动
    context: 同上
    sample: |
      主角：最近老失眠，整个人都不对劲。
      同事：试试这个茶吧，我喝了挺好的。
      主角：行吧，那我试试。
    why: "痛点真实，但主角全程被动接受（别人递过来的东西），没有自主选择和代价，情绪迁移的力度不够。"
