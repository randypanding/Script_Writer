# config/models.yaml
# 模型是生成物（可换），路由策略是资产。改 tier 定义不需要改代码。
schema_version: "1.0"

# 2026-08-16 接入 LongCat-2.0（美团，OpenAI 兼容端点 api.longcat.chat）。
# api_key 走环境变量 OPENAI_API_KEY，绝不落盘；api_base 是端点配置不是密钥。
tiers:
  tier_plan:    {model: "openai/LongCat-2.0", api_base: "https://api.longcat.chat/openai", temperature: 0.8, max_tokens: 32000}
  tier_draft:   {model: "openai/LongCat-2.0", api_base: "https://api.longcat.chat/openai", temperature: 0.9, max_tokens: 24000}
  tier_bulk:    {model: "openai/LongCat-2.0", api_base: "https://api.longcat.chat/openai", temperature: 0.2, max_tokens: 24000}
  tier_judge:   {model: "openai/LongCat-2.0", api_base: "https://api.longcat.chat/openai", temperature: 0.0, max_tokens: 16000}
  tier_reflect: {model: "openai/LongCat-2.0", api_base: "https://api.longcat.chat/openai", temperature: 1.0, max_tokens: 32000}
  tier_embed:   {model: "BAAI/bge-m3", local: true}

# ⚠️ 历史核对记录：
#   - 2026-08-16（T-01）：曾配置 openai/gpt-5.1 家族与 claude-4.5 家族，其中 gpt-5.1-mini 存疑。
#   - 2026-08-16：全部 tier 切换到 LongCat-2.0（单一可用模型）。litellm 不认识该模型的
#     价格，成本统计用下方 cost_usd_per_mtok 兜底（限时折扣价 $0.30/$1.20 每 M token，
#     输出含 reasoning token，见 longcat.chat/platform/docs/zh/api-pay-as-you-go）。
#   - 本文件不参与语义门禁，只参与成本统计与可复现（进 provenance.model_id）。
cost_usd_per_mtok: {input: 0.30, output: 1.20}

budgets:
  per_episode_usd: 0.60
  per_run_usd: 8.0
  per_gepa_run_usd: 20.0
  ci_eval_usd: 3.0

retry: {attempts: 3, backoff: exponential}
langfuse: {enabled: true, host_env: LANGFUSE_HOST, sample_rate: 1.0}
